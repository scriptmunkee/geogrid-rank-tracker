<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoGrid Rank Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <strong>GeoGrid</strong> Rank Tracker
    </div>
    <span id="modeBadge" class="badge">…</span>
  </header>

  <div class="layout">
    <aside class="panel">
      <section>
        <h2><span class="step">1</span> Business</h2>
        <form id="bizForm" class="row">
          <input id="bizQuery" placeholder="Business name and town" autocomplete="off" />
          <button type="submit" class="btn secondary">Find</button>
        </form>
        <p class="hint">Searches Google Maps around the map centre (one API call).</p>
        <ul id="bizResults" class="biz-results"></ul>
        <div id="bizSelected" class="biz-selected" hidden></div>
      </section>

      <section>
        <h2><span class="step">2</span> Keyword and scan type</h2>
        <input id="keyword" placeholder="e.g. seo consultant" />
        <div class="engine-pick" id="enginePick">
          <label class="engine-opt"><input type="radio" name="engine" value="google_maps" checked />
            <span><b>Google Maps</b><small>Rank in the Maps app results</small></span></label>
          <label class="engine-opt"><input type="radio" name="engine" value="google_search" />
            <span><b>Google Search</b><small>Map pack, 1-Box, AI Overview, ads</small></span></label>
        </div>
        <div id="searchOpts" class="search-opts" hidden>
          <label class="check"><input id="optAio" type="checkbox" checked /> <span>AI Overviews <small>+$0.002 a point, refunded when none shows</small></span></label>
          <label class="check"><input id="optFinder" type="checkbox" checked /> <span>Rank beyond the top 3 <small>Local Finder, +$0.004 a point on mobile</small></span></label>
        </div>
      </section>

      <section>
        <h2><span class="step">3</span> Grid</h2>
        <div class="grid-fields">
          <label>Size
            <select id="size">
              <option>3</option><option>5</option><option selected>7</option><option>9</option>
              <option>11</option><option>13</option><option>15</option>
            </select>
          </label>
          <label>Spacing
            <input id="spacing" type="number" min="0.1" max="50" step="0.1" value="1" />
          </label>
          <label>Unit
            <select id="unit"><option value="km">km</option><option value="mi">miles</option></select>
          </label>
          <label>Map zoom
            <select id="zoom">
              <option>11</option><option>12</option><option selected>13</option><option>14</option>
              <option>15</option><option>16</option><option>17</option>
            </select>
          </label>
          <label>Device
            <select id="device"><option value="desktop">Desktop</option><option value="mobile">Mobile</option></select>
          </label>
          <label class="check"><input id="demo" type="checkbox" /> Demo mode</label>
        </div>
        <p class="hint">Click the map to move the grid centre.</p>
      </section>

      <div class="run">
        <div id="estimate" class="estimate"></div>
        <button id="runBtn" class="btn primary" disabled>Run scan</button>
        <p id="formError" class="error" hidden></p>
      </div>

      <section>
        <h2>Scans</h2>
        <ul id="history" class="history"></ul>
      </section>
    </aside>

    <main class="main">
      <div id="scanHeader" class="scan-header" hidden></div>
      <div id="progress" class="progress" hidden><div class="bar"></div><span></span></div>

      <nav id="tabs" class="tabs" hidden>
        <button data-tab="overview" class="active">Overview</button>
        <button data-tab="ai" data-search>AI Overview</button>
        <button data-tab="competitors">Competitors</button>
        <button data-tab="points">Points</button>
      </nav>

      <!-- Overview (also the pre-scan map) -->
      <section id="tab-overview" class="tab-panel">
        <div class="map-card">
          <div class="map-toolbar">
            <div id="layerBar" class="layer-bar" hidden></div>
            <div id="focusBar" class="focus-bar" hidden></div>
          </div>
          <div class="map-wrap">
            <div id="map"></div>
            <div id="legend" class="legend"></div>
          </div>
        </div>
        <div id="metrics" class="metrics" hidden></div>
        <div id="insights" class="card" hidden></div>
        <div id="overviewGrid" class="two-col" hidden></div>
        <div id="overviewExtra" class="stack" hidden></div>
      </section>

      <section id="tab-ai" class="tab-panel stack" hidden></section>
      <section id="tab-competitors" class="tab-panel stack" hidden></section>
      <section id="tab-points" class="tab-panel" hidden></section>
    </main>
  </div>

  <div id="login" class="login" hidden>
    <form id="loginForm" class="login-card">
      <h2>GeoGrid Rank Tracker</h2>
      <p>Enter the app password to run scans.</p>
      <input id="loginPw" type="password" placeholder="Password" autocomplete="current-password" />
      <button class="btn primary" type="submit">Unlock</button>
      <p id="loginError" class="error" hidden></p>
    </form>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
