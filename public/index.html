<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoGrid Rank Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <strong>GeoGrid</strong> Rank Tracker
    </div>
    <span id="modeBadge" class="badge">…</span>
  </header>

  <div class="layout">
    <aside class="panel">
      <section>
        <h2><span class="step">1</span> Business</h2>
        <form id="bizForm" class="row">
          <input id="bizQuery" placeholder="Business name and town" autocomplete="off" />
          <button type="submit" class="btn secondary">Find</button>
        </form>
        <p class="hint">Searches Google Maps around the map centre (one API call).</p>
        <ul id="bizResults" class="biz-results"></ul>
        <div id="bizSelected" class="biz-selected" hidden></div>
      </section>

      <section>
        <h2><span class="step">2</span> Keyword</h2>
        <input id="keyword" placeholder="e.g. seo consultant" />
      </section>

      <section>
        <h2><span class="step">3</span> Grid</h2>
        <div class="grid-fields">
          <label>Size
            <select id="size">
              <option>3</option><option>5</option><option selected>7</option><option>9</option>
              <option>11</option><option>13</option><option>15</option>
            </select>
          </label>
          <label>Spacing
            <input id="spacing" type="number" min="0.1" max="50" step="0.1" value="1" />
          </label>
          <label>Unit
            <select id="unit"><option value="km">km</option><option value="mi">miles</option></select>
          </label>
          <label>Map zoom
            <select id="zoom">
              <option>11</option><option>12</option><option selected>13</option><option>14</option>
              <option>15</option><option>16</option><option>17</option>
            </select>
          </label>
          <label>Device
            <select id="device"><option value="desktop">Desktop</option><option value="mobile">Mobile</option></select>
          </label>
          <label class="check"><input id="demo" type="checkbox" /> Demo mode</label>
        </div>
        <p class="hint">Click the map to move the grid centre.</p>
      </section>

      <div class="run">
        <div id="estimate" class="estimate"></div>
        <button id="runBtn" class="btn primary" disabled>Run scan</button>
        <p id="formError" class="error" hidden></p>
      </div>

      <section>
        <h2>Scans</h2>
        <ul id="history" class="history"></ul>
      </section>
    </aside>

    <main class="main">
      <div id="scanHeader" class="scan-header" hidden></div>
      <div id="progress" class="progress" hidden><div class="bar"></div><span></span></div>
      <div class="map-wrap">
        <div id="map"></div>
        <div class="legend">
          <span><i style="background:var(--r1)"></i>1 to 3</span>
          <span><i style="background:var(--r2)"></i>4 to 10</span>
          <span><i style="background:var(--r3)"></i>11 to 20</span>
          <span><i style="background:var(--nf)"></i>Not found</span>
        </div>
      </div>
      <div id="metrics" class="metrics" hidden></div>
      <section id="compWrap" class="card" hidden>
        <h3>Who owns this grid</h3>
        <div class="table-wrap"><table id="compTable"></table></div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
